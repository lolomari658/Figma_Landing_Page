<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma Landing Page</title>
    <link rel="stylesheet" href="styles1.css">
</head>
<body>
    <h2 class="templates"> 
        Start with a template. Make just about anything.
    </h2>
    <button class="templates-explorer">Explore all templates</button>
    <div class="features">
        <div class="websites-template">
            <img src="images/websites.png">
        </div>
        <div class="socials-template">
            <img src="images/social media.png">
        </div>
        <div class="mobileApps-template">
            <img src="images/mobile apps.png">
        </div>
        <div class="presentations-template">
            <img src="images/presentations.png">
        </div>
        <div class="invitations-template">
            <img src="images/invitations.png">
        </div>
    </div>
</body>
</html>
